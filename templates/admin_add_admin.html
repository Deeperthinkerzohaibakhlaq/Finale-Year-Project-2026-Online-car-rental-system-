{% extends "admin_layout.html" %}
{% block title %}Add Admin{% endblock %}
{% block content %}
<div class="container mt-5">
    <h2>Add New Administrator</h2>
    <div class="card p-4 shadow-sm col-md-8 offset-md-2">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email (must end with @auto-hire.com)</label>
                <input type="email" class="form-control" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Profile Image URL (optional)</label>
                <input type="url" class="form-control" name="profile_image">
            </div>
            <div class="mb-3">
                <label class="form-label">Date of Birth (must be 30+ years old)</label>
                <input type="date" class="form-control" name="birth_date" required>
            </div>
            <button type="submit" class="btn btn-success">Create Admin</button>
            <a href="/admin/manage-admins" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
