{% extends "admin_layout.html" %}
{% block title %}Edit Reservation {{ reservation.id }}{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Reservation</h2>

    <div class="card mb-4">
        <div class="card-body">
            <div class="d-flex align-items-center">
                <img src="{{ reservation_user.get_profile_image_url() }}" alt="{{ reservation_user.name }}" 
                     class="rounded-circle me-3" style="width: 60px; height: 60px; object-fit: cover;">
                <div>
                    <h5 class="mb-1">{{ reservation_user.name }}</h5>
                    <p class="text-muted mb-0">{{ reservation_user.email }}</p>
                </div>
            </div>
        </div>
    </div>

    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ reservation.start_date }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Time</label>
                <input type="time" name="start_time" class="form-control" 
                       value="{{ reservation.get_start_time() if reservation.get_start_time() else '00:00' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" value="{{ reservation.end_date }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End Time</label>
                <input type="time" name="end_time" class="form-control" 
                       value="{{ reservation.get_end_time() if reservation.get_end_time() else '00:00' }}" required>
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Pickup Location</label>
                <input type="text" name="pickup_location" class="form-control" value="{{ reservation.pickup_location or '' }}">
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Return Location</label>
                <input type="text" name="return_location" class="form-control" value="{{ reservation.return_location or '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Cost (PKR)</label>
                <input type="number" step="0.01" name="cost" class="form-control" value="{{ reservation.cost }}" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('admin_reservation_detail', rid=reservation.id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
