<!-- Chat Widget with Flask static image -->
<style>
/* ===== CHAT TOGGLE BUTTON WITH ICON ===== */
.chat-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
}

/* Button container – floating animation */
.robot-btn {
  position: relative;
  width: 80px;
  height: 80px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: floatBot 3s ease-in-out infinite;
  transition: filter 0.2s, transform 0.2s;
  border-radius: 50%;
  background: transparent;
}

.robot-btn:hover {
  filter: drop-shadow(0 0 12px #06c1da) drop-shadow(0 0 24px #0be7c3);
  animation-play-state: paused;
}

/* The image */
.robot-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 30%;
  transition: transform 0.2s;
}

.robot-btn:hover img {
  transform: scale(1.05);
}

/* Floating animation */
@keyframes floatBot {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Attribution – appears on hover */
.icon-attribution {
  position: absolute;
  bottom: -20px;
  font-size: 8px;
  color: #aaa;
  white-space: nowrap;
  background: rgba(0,0,0,0.6);
  padding: 2px 6px;
  border-radius: 12px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  font-family: sans-serif;
}

.robot-btn:hover .icon-attribution {
  opacity: 1;
}

/* Chat window styles (unchanged) */
.chat-window {
  display: none;
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 340px;
  max-height: 480px;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  flex-direction: column;
  overflow: hidden;
  border: 1px solid #ddd;
}
.chat-header {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: #00e5ff;
  padding: 12px 16px;
  border-radius: 16px 16px 0 0;
  font-weight: 600;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  gap: 8px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  min-height: 240px;
  max-height: 340px;
  background: #f7f9fc;
}
.message { margin-bottom: 12px; clear: both; }
.message.user { text-align: right; }
.message.bot { text-align: left; }
.message .bubble {
  display: inline-block;
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 18px;
  line-height: 1.4;
  font-size: 0.9rem;
}
.user .bubble {
  background: #0d6efd;
  color: white;
  border-bottom-right-radius: 4px;
}
.bot .bubble {
  background: #e9ecef;
  color: #333;
  border-bottom-left-radius: 4px;
}
.chat-input-area {
  display: flex;
  border-top: 1px solid #e0e0e0;
  padding: 10px;
  background: white;
}
.chat-input-area input {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 8px 14px;
  outline: none;
  font-size: 0.9rem;
}
.chat-input-area button {
  background: #0f0c29;
  color: #00e5ff;
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  margin-left: 8px;
  cursor: pointer;
  transition: 0.2s;
}
.chat-input-area button:hover { background: #302b63; }

/* Typing dots */
.typing-bubble {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 18px;
}
.typing-bubble .dot {
  width: 8px;
  height: 8px;
  background: #999;
  border-radius: 50%;
  display: inline-block;
  animation: typing-bounce 1.4s infinite ease-in-out both;
}
.typing-bubble .dot:nth-child(1) { animation-delay: 0s; }
.typing-bubble .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-bubble .dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing-bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}
</style>

<div class="chat-widget">
  <!-- Chat toggle button with Flask static image -->
  <div class="robot-btn" id="chatToggle">
    <img src="/static/robot.png" alt="Chatbot icon">
    <!-- Attribution required by Flaticon -->
    
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#00e676" viewBox="0 0 24 24">
        <path d="M12 2a7 7 0 0 0-7 7v2H3v2h2v2a7 7 0 0 0 7 7 7 7 0 0 0 7-7v-2h2v-2h-2V9a7 7 0 0 0-7-7z"/>
      </svg>
      Robo‑Support
      <span style="margin-left:auto; cursor:pointer;" id="chatClose">&times;</span>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="bubble">Hello! I'm AutoHire's assistant. How can I help you?</div>
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Ask me anything..." />
      <button id="chatSend">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const toggle = document.getElementById('chatToggle');
  const windowEl = document.getElementById('chatWindow');
  const close = document.getElementById('chatClose');
  const messages = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSend');

  toggle.onclick = () => { windowEl.style.display = 'flex'; };
  close.onclick = () => { windowEl.style.display = 'none'; };

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    messages.appendChild(msgDiv);
    messages.scrollTop = messages.scrollHeight;
  }

  // Simple escape to prevent XSS
  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, 'user');
    input.value = '';

    // Typing indicator
    const typingId = 'typing-' + Date.now();
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot';
    typingDiv.id = typingId;
    typingDiv.innerHTML = '<div class="bubble typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    messages.appendChild(typingDiv);
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch('/chatbot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      });
      const data = await res.json();
      const typingEl = document.getElementById(typingId);
      if (typingEl) typingEl.remove();
      addMessage(data.response, 'bot');
    } catch (err) {
      const typingEl = document.getElementById(typingId);
      if (typingEl) typingEl.remove();
      addMessage("Sorry, something went wrong. Please try again.", 'bot');
    }
  }

  sendBtn.onclick = sendMessage;
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
});
</script>
